<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Final Card</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="opening">
    <img src="assets/finale/you-did-it.png" alt="YOU DID IT!"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'YOU DID IT!'}))">
  </div>
  <div id="scene">
    <div id="finale"><div id="fstage">
      <img class="circles" src="assets/finale/01-concentric-rings.png" alt="">
      <div class="grp bunnygrp">
        <img src="assets/finale/02-body.png" alt="">
        <div class="grp headgrp">
          <img src="assets/finale/03-head.png" alt="">
          <img class="wink" src="assets/finale/04-wink.png" alt="">
        </div>
        <img class="duck" src="assets/finale/05-duck-on-hand.png" alt="">
      </div>
      <img class="lettering" src="assets/finale/06-lettering.png" alt="That's all Folks!">
      <img class="line" src="assets/finale/07-underline.png" alt="">
    </div></div>
    <div id="mosaic" class="mosaic"></div>
  </div>
  <button id="start" class="btn big">Tap to play</button>
  <button id="sound" class="btn small red" hidden>🔊 Tap for sound</button>
  <button id="replay" class="btn small" hidden>↻ Replay</button>
</div>
<audio id="snd" src="audio.mp3" preload="auto"></audio>
<script src="js/engine.js"></script>
</body>
</html>
